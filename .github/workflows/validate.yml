name: Validate implementations
on:
  pull_request:
    paths: ["_data/implementations/**"]
  push:
    branches: [main]
    paths: ["_data/implementations/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ruby .github/scripts/validate.rb
